<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Radar</title>
<link rel="stylesheet" href="/radar.css">
<div id="wrap">
  <canvas id="scope" width="240" height="240"></canvas>
</div>
<div id="hint">240&times;240 panel simulator &mdash; arrow keys and enter only</div>

<div id="roster-wrap">
  <div id="roster-caption">tracked objects &mdash; debug view, not on the panel</div>
  <div id="roster-scroll">
    <table id="roster">
      <thead>
        <tr>
          <th>Name</th>
          <th>El</th>
          <th>Bearing</th>
          <th>Mag</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="roster-body"></tbody>
    </table>
  </div>
</div>

<div id="showers-wrap">
  <div id="roster-caption">active meteor showers &mdash; radiant, not a tracked object</div>
  <div id="roster-scroll">
    <table id="showers">
      <thead>
        <tr>
          <th>Shower</th>
          <th>El</th>
          <th>Bearing</th>
          <th>ZHR</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="showers-body"></tbody>
    </table>
  </div>
</div>

<div id="neos-wrap">
  <div id="roster-caption">close approaches &mdash; next 30 days, within 10 lunar distances</div>
  <div id="roster-scroll">
    <table id="neos">
      <thead>
        <tr>
          <th>Object</th>
          <th>Approach</th>
          <th>Miss</th>
          <th>Size</th>
          <th>Speed</th>
        </tr>
      </thead>
      <tbody id="neos-body"></tbody>
    </table>
  </div>
</div>

<script src="/radar.js"></script>
