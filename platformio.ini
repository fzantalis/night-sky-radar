[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -fexceptions
build_unflags =
    -std=gnu++11
    -fno-exceptions
test_ignore = *
lib_deps =
    ; GC9B72 panel support landed in LovyanGFX 1.2.27. MIT AND BSD-2-Clause,
    ; so no repeat of the AGPL problem that ruled out Vallado's SGP4.
    lovyan03/LovyanGFX @ ^1.2.29
    ; PAJ7620U2 gesture sensor. MIT.
    acrandal/RevEng PAJ7620 @ ^1.5.0

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -I lib/core/src
    -D UNITY_INCLUDE_DOUBLE
    -fexceptions
build_unflags = -fno-exceptions

; Diagnostic only - flashes a standalone sketch that drives GPIO48 and GPIO38
; on separate RMT channels to identify which one the onboard LED is wired to.
; Board settings are kept identical to the real firmware on purpose: GPIO48
; sits on the VDD_SPI rail, so the PSRAM configuration is part of what is
; being tested. Not built by default_envs.
[env:ledprobe]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
build_src_filter = -<*> +<../tools/ledprobe/>
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags = -std=gnu++11
test_ignore = *
